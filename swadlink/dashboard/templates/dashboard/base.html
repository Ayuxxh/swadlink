<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{{ cafe.name }} | Dashboard{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --green-main: #2e7b55;
      --green-light: #c2f5c8;
      --green-filter: #b2e7bd;
      --gray-border: #4b4b4b33;
      --card-shadow: rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="bg-[var(--green-light)] min-h-screen text-black font-sans">
  <!-- Header -->
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <title>SwadLink Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex flex-col h-screen bg-[var(--green-light)] text-black font-sans">

  <!-- Top Navbar -->
  <header x-data="{ open: false }" class="bg-[var(--green-main)] text-white shadow-md sticky top-0 z-50">
    <div class="mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-20">
        <!-- Branding -->
        <div class="flex flex-col">
          <div class="text-2xl sm:text-3xl font-bold">{{ cafe.name }}</div>
          <span class="text-green-300 text-xs">Powered by SwadLink</span>
        </div>

        <!-- Desktop Nav -->
        <nav class="hidden md:flex space-x-6 font-semibold">
          <a href="{% url 'dashboard:dashboard' slug=cafe.slug %}" class="hover:text-green-200">Dashboard</a>
          <a href="{% url 'dashboard:view_order' slug=cafe.slug %}" class="hover:text-green-200">Orders</a>
          <a href="{% url 'dashboard:edit_menu' slug=cafe.slug %}" class="hover:text-green-200">Menu</a>
          <a href="{% url 'dashboard:reports' slug=cafe.slug %}" class="hover:text-green-200">Reports</a>
          <a href="{% url 'dashboard:employee_dashboard' slug=cafe.slug %}" class="hover:text-green-200">Employees</a>
          <!-- <a href="" class="hover:text-green-200">Feedback</a> -->
          <a href="" class="hover:text-green-200">Settings</a>
          <a href="{% url 'accounts:logout' slug=cafe.slug %}" class="hover:text-green-200">Logout</a>
        </nav>

        <!-- Mobile Menu Button -->
        <div class="md:hidden">
          <button @click="open = !open" class="text-white text-3xl focus:outline-none">
            ☰
          </button>
        </div>
      </div>
    </div>

    <!-- Mobile Menu -->
    <div x-show="open" x-transition class="md:hidden px-4 pb-4 space-y-2 font-semibold">
      <a href="{% url 'dashboard:dashboard' slug=cafe.slug %}" class="block hover:text-green-200">Dashboard</a>
      <a href="{% url 'dashboard:view_order' slug=cafe.slug %}" class="block hover:text-green-200">Orders</a>
      <a href="{% url 'dashboard:edit_menu' slug=cafe.slug %}" class="block hover:text-green-200">Menu</a>
      <a href="{% url 'dashboard:reports' slug=cafe.slug %}" class="block hover:text-green-200">Reports</a>
      <a href="{% url 'dashboard:employee_dashboard' slug=cafe.slug %}" class="block hover:text-green-200">Employees</a>
      <!-- <a href="" class="block hover:text-green-200">Feedback</a> -->
      <a href="" class="block hover:text-green-200">Settings</a>
      <a href="{% url 'accounts:logout' slug=cafe.slug %}" class="block hover:text-green-200">Logout</a>
    </div>
  </header>



  
{% if messages %}
  <div id="messages">
    {% for message in messages %}
      <div class="w-full relative py-4 px-6 text-white text-center font-medium
                  {% if message.tags == 'success' %}
                    bg-green-600
                  {% elif message.tags == 'error' %}
                    bg-red-600
                  {% elif message.tags == 'warning' %}
                    bg-yellow-400 text-black
                  {% else %}
                    bg-gray-700
                  {% endif %}
                  ">
        {{ message }}
        <!-- Close Button -->
        <button onclick="this.parentElement.remove()" 
                class="absolute right-4 top-3 text-xl font-bold text-white hover:text-gray-200">
          &times;
        </button>
      </div>
    {% endfor %}
  </div>
{% endif %}


  <!-- Main Content -->
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>


<script>
  document.getElementById('menu-toggle').addEventListener('click', function () {
    const navLinks = document.getElementById('nav-links');
    navLinks.classList.toggle('hidden');
    navLinks.classList.toggle('flex');
  });
</script>
