<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ cafe.name }} | Employee Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --green-main: #2e7b55;
      --green-light: #e6f4ec;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

<!-- Navbar -->
<nav class="bg-green-50 shadow-md px-4 py-3 flex justify-between items-center border-b border-green-200">
  <div>
    <h1 class="text-xl sm:text-2xl font-bold text-[var(--green-main)]">{{ cafe.name }}</h1>
    <p class="text-xs text-gray-600">Powered by <span class="font-semibold text-green-700">Qrahi</span></p>
  </div>
  
  <div class="flex items-center gap-3">
    <a href="{% url 'dashboard:dashboard' slug=cafe.slug %}" class="text-sm font-medium text-[var(--green-main)] hover:underline">
      Owner Dashboard
    </a>
    <a href="{% url 'accounts:logout' slug=cafe.slug %}" class="text-sm text-white bg-red-600 hover:bg-red-700 px-4 py-2 rounded-md">
      Logout
    </a>
  </div>
</nav>




  <!-- Action Buttons -->
  <div class="flex flex-col sm:flex-row justify-center gap-4 my-6 px-4">
    <a href="{% url 'orders:create_order.get_customer_details' slug=cafe.slug %}" class="bg-[var(--green-main)] text-white font-medium px-6 py-2 rounded-md shadow hover:bg-green-700 transition">
      ➕ Create Order
    </a>
    <a href="{% url 'dashboard:kot' slug=cafe.slug %}" class="bg-gray-200 text-green-800 font-medium px-6 py-2 rounded-md shadow hover:bg-gray-300 transition">
      🧾 KOT View
    </a>
  </div>

<div class="orders-container max-w-6xl mx-auto px-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 pb-10">

</div>


    <!-- Add more order cards as needed -->

  </div>
<script>
const cafeSlug = "{{ cafe.slug }}";

async function fetchOrders() {
  const res = await fetch(`{% url "dashboard:employee_live_orders" cafe.slug %}`);
  const data = await res.json();

  const container = document.querySelector(".orders-container");
  container.innerHTML = ""; // clear old orders

  if (data.orders.length === 0) {
    container.innerHTML = `<p class="text-center text-gray-500 col-span-3">No active orders found.</p>`;
    return;
  }

  data.orders.forEach(order => {
    const orderCard = document.createElement("div");
    orderCard.className = "bg-white border-l-4 border-[var(--green-main)] p-4 rounded-xl shadow hover:shadow-lg transition flex flex-col justify-between";
    orderCard.innerHTML = `
      <div>
        <h2 class="text-lg font-bold text-gray-800">
          Order #${order.order_code} - Table ${order.table}
        </h2>
        <p class="text-xs text-gray-500 mb-2">Placed at ${order.time}</p>

        <ul class="text-sm space-y-1 mb-4">
          ${order.items.map(i => `<li>• ${i.name} x${i.qty}</li>`).join("")}
        </ul>

        <p class="text-sm font-semibold text-[var(--green-main)]">
          Total: ₹${order.total_amount} 
        </p>
      </div>

      <div class="grid grid-cols-3 gap-2 mt-4 text-center text-xs font-semibold">
        <a href="#" class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-2 rounded-lg shadow transition">Update</a>
        <a href="#" onclick="closeOrder(${order.id}, this)"  class="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded-lg shadow transition" >Close</a>
        <button onclick="cancelOrder(${order.id})"
          class="bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-lg shadow transition">
          Cancel
        </button>
      </div>
    `;
    container.appendChild(orderCard);
  });
}

// Initial fetch
fetchOrders();
// Poll every 15 seconds
setInterval(fetchOrders, 10000);

 function closeOrder(orderId, element) {

    const urlTemplate = "{% url 'dashboard:close_order'  cafe.slug 0 %}";
    const url = urlTemplate.replace("0", orderId);
    console.log(url)
    element.href = url;
  };


async function cancelOrder(orderId) {
  const confirmed = confirm("Are you sure you want to cancel this order?");
  if (!confirmed) return;
            const urlTemplate = "{% url 'dashboard:cancel_order'  cafe.slug 0 %}";
    const finalUrl = urlTemplate.replace("0", orderId);
  const res = await fetch(finalUrl, {
    method: "POST",
    headers: {
    'X-CSRFToken': '{{ csrf_token }}'  // include CSRF token if needed
    }
  });

  const data = await res.json();
  if (data.success) {

    fetchOrders();  // refresh orders
  } else {
    alert(data.error || "Failed to cancel order.");
  }
}

</script>




</body>
</html>
