{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Summary - {{ cafe.name }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-green-100 to-green-200 text-gray-800 min-h-screen pb-24">

  <!-- Header -->
  <div class="bg-green-800 text-white text-center py-5 px-4 shadow-md">
    <h1 class="text-3xl font-extrabold tracking-wide leading-tight">Order Summary</h1>
    <p class="text-sm text-green-300 italic">Powered by SwadLink • {{ cafe.name }}</p>
  </div>

  <!-- Summary Card -->
  <div class="max-w-md mx-auto mt-8 bg-white p-6 rounded-xl shadow-lg border border-gray-200 space-y-6">

    <!-- Customer Info -->
    <div class="space-y-1 text-sm">
      <p><span class="font-semibold">Customer:</span> {{ customer }}</p>
      <!-- Add phone or table if needed -->
    </div>

    <!-- Items -->
    <div>
      <h2 class="text-lg font-bold mb-2">Items Ordered</h2>
      <div class="space-y-3 text-sm">
{% for item in cart %}
  <div class="flex justify-between items-center">
    <div><p class="font-medium">{{ item.name }} x {{ item.qty }}</p></div>
    <div>₹{{ item.subtotal }}</div>
  </div>
{% endfor %}
      </div>
    </div>

    <!-- Thank You -->
    <div class="text-center pt-4 text-green-700 font-semibold">
      ✅ Order successfully created!
    </div>

    <!-- CTA -->
    <div class="pt-2 text-center">
      <a href="{% url 'dashboard:employee_dashboard' slug=cafe.slug %}" class="text-sm text-green-700 underline hover:text-green-900">Back to Dashboard</a>
    </div>

  </div>
</body>
</html>
